<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pult</title>
  <style>
    body {
      margin: 0;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* REMOTE */
    .remote {
      width: 220px;
      background: #1a1a1a;
      border-radius: 32px;
      padding: 28px 20px 32px;
      border: 2px solid #333;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 10;
    }
    .power-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e74c3c;
      margin: 0 auto 4px;
    }
    .main-row {
      display: grid;
      grid-template-columns: 1fr 40px 1fr;
      gap: 10px;
      align-items: center;
    }
    .left-col, .right-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .num-btn {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      background: #2e2e2e;
      border: 1px solid #444;
      color: #e0e0e0;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
      user-select: none;
      position: relative;
    }
    .num-btn:active {
      transform: scale(0.96);
    }
    .center-col {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .off-btn {
      width: 36px;
      height: 152px;
      border-radius: 18px;
      background: #c0392b;
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.1s;
    }
    .off-btn:active {
      background: #a93226;
      transform: scale(0.97);
    }

    /* GLOW (6-tugma) */
    .glow .num-btn {
      box-shadow: 0 0 12px 4px rgba(255, 200, 0, 0.7);
      background: #3a3500;
      border-color: #f0c000;
      color: #f0c000;
    }

    /* 1 - INPUT */
    .input-popup {
      display: none;
      position: absolute;
      left: 110%;
      top: 50%;
      transform: translateY(-50%);
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 6px 8px;
      display: none;
      gap: 6px;
      align-items: center;
      white-space: nowrap;
      z-index: 100;
    }
    .input-popup input {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      width: 110px;
      outline: none;
    }
    .input-popup button {
      background: #2e2e2e;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .input-popup.show {
      display: flex;
    }

    /* 2 - LOADING OVERLAY */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .loading-overlay.show {
      display: flex;
    }
    .spinner {
      width: 52px;
      height: 52px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #fff;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    /* 3 - HELLO DEAR overlay */
    .hello-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 998;
      align-items: center;
      justify-content: center;
    }
    .hello-overlay.show {
      display: flex;
    }
    .hello-text {
      color: #fff;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 2px;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* 4 - CANVAS PAINT */
    .paint-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 997;
      flex-direction: column;
    }
    .paint-overlay.show {
      display: flex;
    }
    .paint-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: #e0e0e0;
      border-bottom: 1px solid #bbb;
    }
    .paint-toolbar label {
      font-size: 13px;
      color: #333;
    }
    .paint-toolbar input[type=color] {
      width: 32px;
      height: 28px;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    .paint-toolbar input[type=range] {
      width: 80px;
    }
    .paint-toolbar button {
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      margin-left: auto;
    }
    #paintCanvas {
      flex: 1;
      cursor: crosshair;
      display: block;
    }

    /* 5 - EMOJI behind remote */
    .emoji-bg {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }
    .emoji-bg.show {
      display: flex;
    }
    .emoji-bg span {
      font-size: 1000px;
      line-height: 1;
      user-select: none;
    }
  </style>
</head>
<body>

  <!-- 2: Loading -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Yuklanmoqda...</div>
  </div>

  <!-- 3: Hello Dear -->
  <div class="hello-overlay" id="helloOverlay" onclick="document.getElementById('helloOverlay').classList.remove('show')">
    <div class="hello-text">HELLO DEAR</div>
  </div>

  <!-- 4: Paint -->
  <div class="paint-overlay" id="paintOverlay">
    <div class="paint-toolbar">
      <label>Rang:</label>
      <input type="color" id="paintColor" value="#000000" />
      <label>Qalinlik:</label>
      <input type="range" id="paintSize" min="2" max="40" value="6" />
      <button onclick="closePaint()">✕ Yopish</button>
    </div>
    <canvas id="paintCanvas"></canvas>
  </div>

  <!-- 5: Emoji behind -->
  <div class="emoji-bg" id="emojiBg">
    <span>😄</span>
  </div>

  <!-- REMOTE -->
  <div class="remote" id="remote">
    <div class="power-dot"></div>
    <div class="main-row">

      <div class="left-col">

        <!-- 1 -->
        <div style="position:relative;">
          <button class="num-btn" onclick="toggleInput()">1</button>
          <div class="input-popup" id="inputPopup">
            <input type="text" id="inputField" placeholder="Yozing..." />
            <button onclick="sendInput()">Send</button>
          </div>
        </div>

        <!-- 2 -->
        <button class="num-btn" onclick="startLoading()">2</button>

        <!-- 3 -->
        <button class="num-btn" onclick="showHello()">3</button>

      </div>

      <div class="center-col">
        <button class="off-btn" onclick="window.close()">OFF</button>
      </div>

      <div class="right-col">
        <!-- 4 -->
        <button class="num-btn" onclick="openPaint()">4</button>
        <!-- 5 -->
        <button class="num-btn" onclick="toggleEmoji()">5</button>
        <!-- 6 -->
        <button class="num-btn" onclick="toggleGlow()">6</button>
      </div>

    </div>
  </div>

  <script>
    // ── 1: INPUT ──
    function toggleInput() {
      const p = document.getElementById('inputPopup');
      p.classList.toggle('show');
      if (p.classList.contains('show')) document.getElementById('inputField').focus();
    }
    function sendInput() {
      const val = document.getElementById('inputField').value.trim();
      if (val) alert('Yuborildi: ' + val);
      document.getElementById('inputField').value = '';
      document.getElementById('inputPopup').classList.remove('show');
    }

    // ── 2: LOADING ──
    const msgs = ['Yuklanmoqda...', 'Iltimos kuting...', 'Deyarli tayyor...', 'Yakunlanmoqda...'];
    function startLoading() {
      const ov = document.getElementById('loadingOverlay');
      const txt = document.getElementById('loadingText');
      ov.classList.add('show');
      let i = 0;
      txt.textContent = msgs[0];
      const iv = setInterval(() => {
        i++;
        if (i < msgs.length) txt.textContent = msgs[i];
        else { clearInterval(iv); setTimeout(() => ov.classList.remove('show'), 500); }
      }, 900);
    }

    // ── 3: HELLO DEAR ──
    function showHello() {
      document.getElementById('helloOverlay').classList.add('show');
    }

    // ── 4: PAINT ──
    function openPaint() {
      const ov = document.getElementById('paintOverlay');
      ov.classList.add('show');
      setupCanvas();
    }
    function closePaint() {
      document.getElementById('paintOverlay').classList.remove('show');
    }
    function setupCanvas() {
      const canvas = document.getElementById('paintCanvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 48;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      let drawing = false;
      canvas.onmousedown = e => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); };
      canvas.onmousemove = e => {
        if (!drawing) return;
        ctx.lineWidth = document.getElementById('paintSize').value;
        ctx.lineCap = 'round';
        ctx.strokeStyle = document.getElementById('paintColor').value;
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();
      };
      canvas.onmouseup = () => drawing = false;
      canvas.onmouseleave = () => drawing = false;
      // touch
      canvas.ontouchstart = e => { e.preventDefault(); drawing = true; const t=e.touches[0]; ctx.beginPath(); ctx.moveTo(t.clientX, t.clientY-48); };
      canvas.ontouchmove = e => { e.preventDefault(); if(!drawing) return; const t=e.touches[0]; ctx.lineWidth=document.getElementById('paintSize').value; ctx.lineCap='round'; ctx.strokeStyle=document.getElementById('paintColor').value; ctx.lineTo(t.clientX, t.clientY-48); ctx.stroke(); };
      canvas.ontouchend = () => drawing = false;
    }

    // ── 5: EMOJI ──
    function toggleEmoji() {
      document.getElementById('emojiBg').classList.toggle('show');
    }

    // ── 6: GLOW ──
    function toggleGlow() {
      document.getElementById('remote').classList.toggle('glow');
    }
  </script>
</body>
</html>
